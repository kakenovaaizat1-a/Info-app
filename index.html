<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школьный Парламент</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide">Школьный Парламент</h1>
        <p class="text-xs text-slate-400">Голос учеников — будущее школы</p>
      </div>
      <button onclick="toggleAdminModal()" id="adminBtn" class="bg-indigo-600 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded-lg transition font-medium">
        🔑 Админ
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Admin Banner Status -->
    <div id="adminBadge" class="hidden bg-emerald-100 border border-emerald-400 text-emerald-800 text-xs px-3 py-2 rounded-lg flex justify-between items-center">
      <span>⚙️ Вы вошли как <strong>Администратор</strong></span>
      <button onclick="logoutAdmin()" class="text-emerald-900 underline font-bold">Выйти</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-slate-300 text-sm font-medium">
      <button id="tabCandidates" onclick="switchTab('candidates')" class="flex-1 py-2 text-center border-b-2 border-indigo-600 font-bold text-indigo-600">Кандидаты</button>
      <button id="tabEvents" onclick="switchTab('events')" class="flex-1 py-2 text-center text-slate-500 border-b-2 border-transparent">Мероприятия</button>
    </div>

    <!-- Candidates Section -->
    <section id="sectionCandidates" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-900">Кандидаты в Парламент</h2>
        <button id="addCandidateBtn" onclick="openAddCandidateModal()" class="hidden bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow">
          + Добавить
        </button>
      </div>
      <div id="candidatesList" class="space-y-4"></div>
    </section>

    <!-- Events Section -->
    <section id="sectionEvents" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-900">Календарь событий</h2>
        <button id="addEventBtn" onclick="openAddEventModal()" class="hidden bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow">
          + Добавить
        </button>
      </div>
      <div id="eventsList" class="space-y-3"></div>
    </section>

  </main>

  <!-- Candidate Details / Question Modal -->
  <div id="candidateModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden z-50">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-start">
        <div>
          <span id="modalCandidateId" class="text-xs font-mono bg-slate-100 text-slate-600 px-2 py-0.5 rounded">ID</span>
          <h3 id="modalCandidateName" class="text-xl font-bold text-slate-900 mt-1"></h3>
          <p id="modalCandidateRole" class="text-xs text-indigo-600 font-medium"></p>
        </div>
        <button onclick="closeCandidateModal()" class="text-slate-400 text-xl font-bold">✕</button>
      </div>

      <div class="bg-slate-50 p-3 rounded-lg border text-sm text-slate-700">
        <h4 class="font-bold text-xs text-slate-500 uppercase tracking-wider mb-1">Предвыборная программа</h4>
        <p id="modalCandidateProgram"></p>
      </div>

      <!-- Question Form -->
      <div class="border-t pt-3 space-y-2">
        <h4 class="font-bold text-sm text-slate-800">Задать вопрос кандидату</h4>
        <textarea id="questionInput" rows="2" placeholder="Напишите ваш вопрос..." class="w-full text-sm border p-2 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        <button onclick="sendQuestion()" class="w-full bg-indigo-600 text-white text-sm font-medium py-2 rounded-lg hover:bg-indigo-700 transition">
          Отправить вопрос
        </button>
      </div>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div id="adminModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white w-full max-w-xs rounded-2xl p-5 space-y-4">
      <h3 class="text-lg font-bold text-slate-900 text-center">Панель администратора</h3>
      <input type="password" id="adminPassword" placeholder="Введите пароль" class="w-full border p-2 text-sm rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="flex space-x-2">
        <button onclick="toggleAdminModal()" class="flex-1 bg-slate-200 text-xs py-2 rounded-lg font-medium">Отмена</button>
        <button onclick="loginAdmin()" class="flex-1 bg-indigo-600 text-white text-xs py-2 rounded-lg font-medium">Войти</button>
      </div>
    </div>
  </div>

  <script>
    let candidates = [
      {
        id: "CAND-001",
        name: "Алихан Сарсенов",
        role: "Кандидат в Президенты",
        grade: "10B класс",
        program: "Введение школьного радио, проведение киберспортивного турнира и день самоуправления каждый месяц.",
        votes: 142
      },
      {
        id: "CAND-002",
        name: "Аружан Нурланова",
        role: "Пресс-секретарь",
        grade: "10A класс",
        program: "Запуск школьного Telegram-канала, еженедельная дайджест-газета и фотозоны на мероприятиях.",
        votes: 98
      }
    ];

    let events = [
      { id: "EVT-1", title: "Предвыборные дебаты", date: "2026-09-20", location: "Актовый зал" },
      { id: "EVT-2", title: "День голосования", date: "2026-09-25", location: "Холл 1 этажа" }
    ];

    let currentCandidate = null;
    let isAdmin = false;

    function renderCandidates() {
      const container = document.getElementById('candidatesList');
      container.innerHTML = candidates.map(c => `
        <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-mono bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-bold">${c.id}</span>
              <h3 class="font-bold text-slate-900 text-base mt-1">${c.name}</h3>
              <p class="text-xs text-slate-500">${c.role} • ${c.grade}</p>
            </div>
            ${isAdmin ? `<button onclick="deleteCandidate('${c.id}')" class="text-red-500 text-xs font-bold bg-red-50 px-2 py-1 rounded">Удалить</button>` : ''}
          </div>
          <p class="text-xs text-slate-600 line-clamp-2">${c.program}</p>
          <button onclick="openCandidateModal('${c.id}')" class="w-full bg-slate-900 hover:bg-indigo-600 text-white text-xs py-2 rounded-lg transition font-medium">
            Подробнее и задать вопрос
          </button>
        </div>
      `).join('');
    }

    function renderEvents() {
      const container = document.getElementById('eventsList');
      container.innerHTML = events.map(e => `
        <div class="bg-white border border-slate-200 p-3 rounded-xl flex justify-between items-center">
          <div>
            <h4 class="font-bold text-sm text-slate-800">${e.title}</h4>
            <p class="text-xs text-slate-500">📅 ${e.date} • 📍 ${e.location}</p>
          </div>
          ${isAdmin ? `<button onclick="deleteEvent('${e.id}')" class="text-red-500 text-xs font-bold">✕</button>` : ''}
        </div>
      `).join('');
    }

    function openCandidateModal(id) {
      currentCandidate = candidates.find(c => c.id === id);
      if (!currentCandidate) return;

      document.getElementById('modalCandidateId').innerText = currentCandidate.id;
      document.getElementById('modalCandidateName').innerText = currentCandidate.name;
      document.getElementById('modalCandidateRole').innerText = `${currentCandidate.role} (${currentCandidate.grade})`;
      document.getElementById('modalCandidateProgram').innerText = currentCandidate.program;

      document.getElementById('candidateModal').classList.remove('hidden');
    }

    function closeCandidateModal() {
      document.getElementById('candidateModal').classList.add('hidden');
    }

    function sendQuestion() {
      const text = document.getElementById('questionInput').value.trim();
      if (!text) return alert("Введите вопрос!");
      alert(`Ваш вопрос кандидату ${currentCandidate.name} успешно отправлен!`);
      document.getElementById('questionInput').value = '';
      closeCandidateModal();
    }

    function toggleAdminModal() {
      document.getElementById('adminModal').classList.toggle('hidden');
    }

    function loginAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === 'admin2026') {
        isAdmin = true;
        document.getElementById('adminBadge').classList.remove('hidden');
        document.getElementById('addCandidateBtn').classList.remove('hidden');
        document.getElementById('addEventBtn').classList.remove('hidden');
        document.getElementById('adminBtn').classList.add('hidden');
        toggleAdminModal();
        renderCandidates();
        renderEvents();
        alert('Вы успешно вошли как Администратор!');
      } else {
        alert('Неверный пароль!');
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      document.getElementById('adminBadge').classList.add('hidden');
      document.getElementById('addCandidateBtn').classList.add('hidden');
      document.getElementById('addEventBtn').classList.add('hidden');
      document.getElementById('adminBtn').classList.remove('hidden');
      renderCandidates();
      renderEvents();
    }

    function openAddCandidateModal() {
      const name = prompt("Имя и Фамилия кандидата:");
      const role = prompt("Должность (например, Президент):");
      const grade = prompt("Класс (например, 10B):");
      const program = prompt("Предвыборная программа:");

      if (name && role) {
        const newCand = {
          id: `CAND-00${candidates.length + 1}`,
          name,
          role,
          grade: grade || '10 класс',
          program: program || 'Программа формируется.',
          votes: 0
        };
        candidates.push(newCand);
        renderCandidates();
      }
    }

    function deleteCandidate(id) {
      if (confirm("Удалить кандидата?")) {
        candidates = candidates.filter(c => c.id !== id);
        renderCandidates();
      }
    }

    function switchTab(tab) {
      if (tab === 'candidates') {
        document.getElementById('sectionCandidates').classList.remove('hidden');
        document.getElementById('sectionEvents').classList.add('hidden');
        document.getElementById('tabCandidates').className = "flex-1 py-2 text-center border-b-2 border-indigo-600 font-bold text-indigo-600";
        document.getElementById('tabEvents').className = "flex-1 py-2 text-center text-slate-500 border-b-2 border-transparent";
      } else {
        document.getElementById('sectionCandidates').classList.add('hidden');
        document.getElementById('sectionEvents').classList.remove('hidden');
        document.getElementById('tabEvents').className = "flex-1 py-2 text-center border-b-2 border-indigo-600 font-bold text-indigo-600";
        document.getElementById('tabCandidates').className = "flex-1 py-2 text-center text-slate-500 border-b-2 border-transparent";
      }
    }

    renderCandidates();
    renderEvents();
  </script>
</body>
</html>
